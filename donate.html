<html lang="en">
<head>
<script>/* Analytics opt-out (set on policies.html) — read BEFORE Google Analytics loads. */try{if(localStorage.getItem('dba_no_analytics')==='1')window['ga-disable-G-2SSTL5WSW9']=true;}catch(e){}</script>

<title>Shoot-a-Thon — Downer Basketball Academy</title>
<meta name="description" content="Sponsor an Aces player per made free throw, or make a one-time donation, in our Shoot-a-Thon.">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Outfit:wght@300;400;500;600;700;800&family=IBM+Plex+Mono:wght@300;400;500&family=Saira+Condensed:wght@600;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--mrn:#8B1A2B;--mrn-h:#A82E42;--pink:#D4506A;--bg:#0A0A0C;--bg2:#101014;--glass:rgba(255,255,255,.035);--glass-b:rgba(255,255,255,.07);--txt:#F0ECE8;--txt-m:rgba(240,236,232,.82);--dim:#9B95A0;--ok:#3fae5a;--r:16px}
body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--txt);-webkit-font-smoothing:antialiased;line-height:1.55;min-height:100vh}
a{color:inherit;text-decoration:none}
.dim{color:var(--dim)}
.nav{border-bottom:1px solid var(--glass-b);padding:0 28px;display:flex;justify-content:space-between;align-items:center;height:64px}
.logo-main{font-family:'Saira Condensed',sans-serif;font-weight:800;font-size:22px;color:#fff;letter-spacing:4px;text-transform:uppercase;line-height:.9}
.logo-sub{font-family:'Saira Condensed',sans-serif;font-weight:600;font-size:10px;letter-spacing:7px;color:#888;text-transform:uppercase;text-align:center}
.nav a.back{font-size:.82rem;color:var(--dim)}
.wrap{max-width:720px;margin:0 auto;padding:34px 20px 70px}
.card{background:var(--glass);border:1px solid var(--glass-b);border-radius:var(--r);padding:24px 22px;margin-bottom:18px}
.kicker{font-family:'Saira Condensed',sans-serif;letter-spacing:5px;text-transform:uppercase;color:var(--pink);font-size:.78rem;font-weight:600}
h1{font-family:'DM Serif Display',serif;font-weight:400;font-size:2.2rem;margin:6px 0 8px;line-height:1.08}
.lead{color:var(--txt-m);max-width:560px}
.crumb{font-size:.82rem;color:var(--dim);margin-bottom:12px}
.crumb a:hover{color:var(--txt)}
/* thermometer */
.therm{height:14px;border-radius:999px;background:var(--bg);border:1px solid var(--glass-b);overflow:hidden;margin-top:4px}
.therm > i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--mrn),var(--pink));transition:width .8s ease}
.therm-nums{display:flex;justify-content:space-between;align-items:baseline;margin-top:7px;font-size:.86rem;flex-wrap:wrap;gap:6px}
.therm-nums b{font-family:'Saira Condensed',sans-serif;font-size:1.15rem;color:#fff;letter-spacing:.5px}
.therm-nums .pct{font-family:'Saira Condensed',sans-serif;color:var(--pink);font-size:1.05rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 26px;border-radius:12px;font-weight:700;font-size:1rem;background:var(--mrn);color:#fff;border:none;cursor:pointer;transition:background .25s;font-family:inherit}
.btn:hover{background:var(--mrn-h)}
.btn.full{width:100%}
.btn.ghost{background:var(--glass);border:1px solid var(--glass-b);color:var(--txt);font-weight:600;font-size:.88rem;padding:10px 18px}
.btn.ghost:hover{background:rgba(255,255,255,.06)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:560px){.grid{grid-template-columns:1fr}h1{font-size:1.9rem}}
.tile{display:block;background:var(--glass);border:1px solid var(--glass-b);border-radius:14px;padding:18px 18px;transition:border-color .2s,transform .2s}
.tile:hover{border-color:var(--pink)}
.tile .tname{font-family:'DM Serif Display',serif;font-size:1.3rem;margin-bottom:2px}
.tile .tsub{font-size:.8rem;color:var(--dim);margin-bottom:10px}
.tile .go{font-size:.82rem;color:var(--pink);font-weight:600;margin-top:10px;display:inline-block}
.sec-h{font-family:'Saira Condensed',sans-serif;letter-spacing:3px;text-transform:uppercase;color:var(--dim);font-size:.82rem;font-weight:600;margin:24px 0 12px}
.search{width:100%;background:var(--bg);border:1px solid var(--glass-b);border-radius:12px;padding:12px 14px;color:var(--txt);font-family:inherit;font-size:.95rem;margin-bottom:14px}
.search:focus{outline:none;border-color:var(--pink)}
.supp .s{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--glass-b);font-size:.88rem}
.supp .s:last-child{border-bottom:none}
.supp .s .who{color:var(--txt)}.supp .s .who b{font-weight:600}
.supp .s .msg{color:var(--dim);font-style:italic;max-width:60%;text-align:right}
.chip{display:inline-block;background:var(--bg);border:1px solid var(--glass-b);border-radius:999px;padding:6px 13px;font-size:.82rem;color:var(--txt-m);margin:0 6px 6px 0}
.chip b{color:var(--txt)}
.lb{padding:4px 0}
.lrow{display:flex;align-items:center;gap:12px;padding:11px 18px;border-bottom:1px solid var(--glass-b)}
.lrow:last-child{border-bottom:none}
.lrow:hover{background:rgba(255,255,255,.03)}
.lrow .rank{font-family:'Saira Condensed',sans-serif;font-weight:800;color:var(--pink);font-size:1.1rem;width:22px;text-align:center}
.lrow .lname{flex:1;font-weight:500}
.lrow .lamt{font-family:'Saira Condensed',sans-serif;color:#fff;font-size:1.05rem;letter-spacing:.5px}
.share-btns{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.share-btns a,.share-btns button{flex:1;min-width:92px;display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--bg);border:1px solid var(--glass-b);border-radius:10px;padding:11px 8px;color:var(--txt);cursor:pointer;font-family:inherit;font-weight:600;font-size:.84rem;text-decoration:none}
.share-btns a:hover,.share-btns button:hover{border-color:var(--pink)}
#qrbox{background:#fff;padding:12px;border-radius:12px;display:inline-block;margin:10px 0 4px}
#qrbox img,#qrbox canvas{display:block}
.about{color:var(--txt-m);font-size:.95rem;margin-top:12px;white-space:pre-wrap}
.share-row{display:flex;gap:8px;align-items:center;margin:8px 0;flex-wrap:wrap}
.share-row input{flex:1;min-width:180px;background:var(--bg);border:1px solid var(--glass-b);border-radius:10px;padding:10px 12px;color:var(--txt);font-family:'IBM Plex Mono',monospace;font-size:.78rem}
/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:flex-start;justify-content:center;padding:30px 16px;overflow-y:auto;z-index:200}
.modal-bg.on{display:flex}
.modal{background:#141418;border:1px solid var(--glass-b);border-radius:var(--r);max-width:480px;width:100%;padding:26px 24px}
.modal h2{font-family:'DM Serif Display',serif;font-weight:400;font-size:1.5rem;margin-bottom:4px}
.modal .msub{color:var(--dim);font-size:.86rem;margin-bottom:18px}
.seg{display:flex;gap:8px;margin-bottom:16px}
.seg button{flex:1;background:var(--bg);border:1px solid var(--glass-b);border-radius:12px;padding:12px 8px;color:var(--txt-m);cursor:pointer;font-family:inherit;font-size:.9rem;font-weight:600;text-align:center}
.seg button .s-sub{display:block;font-weight:400;font-size:.72rem;color:var(--dim);margin-top:2px}
.seg button[aria-pressed="true"]{border-color:var(--pink);background:rgba(212,80,106,.1);color:var(--txt)}
.fg{margin-bottom:14px}
.fg>label{display:block;font-size:.82rem;color:var(--txt-m);margin-bottom:6px;font-weight:500}
.inp{width:100%;background:var(--bg);border:1px solid var(--glass-b);border-radius:12px;padding:12px 14px;color:var(--txt);font-family:inherit;font-size:1rem}
.inp:focus{outline:none;border-color:var(--pink)}
.money-in{position:relative}.money-in .pre{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--dim)}.money-in .inp{padding-left:28px}
.row2{display:flex;gap:12px}.row2>*{flex:1}
.est{background:var(--bg);border:1px dashed var(--glass-b);border-radius:12px;padding:11px 14px;font-size:.86rem;color:var(--txt-m);margin-bottom:14px}.est b{color:#fff}
.quick{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.quick button{flex:1;min-width:62px;background:var(--bg);border:1px solid var(--glass-b);border-radius:10px;padding:11px 6px;color:var(--txt);cursor:pointer;font-family:inherit;font-weight:600;font-size:.95rem}
.quick button:hover{border-color:var(--pink)}
.quick button.on{border-color:var(--pink);background:rgba(212,80,106,.12)}
.check{display:flex;align-items:flex-start;gap:9px;font-size:.86rem;color:var(--txt-m);cursor:pointer;margin-bottom:14px}.check input{margin-top:3px}
.err{color:var(--pink);font-size:.84rem;margin-top:8px;min-height:1.1em}
.mclose{float:right;background:none;border:none;color:var(--dim);font-size:1.4rem;cursor:pointer;line-height:1;margin:-6px -4px 0 0}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.hidden{display:none}
.banner{border-radius:12px;padding:11px 15px;margin-bottom:16px;font-size:.9rem;background:rgba(212,80,106,.12);border:1px solid rgba(212,80,106,.4);color:var(--txt-m)}
.closed{text-align:center;padding:50px 20px}
.matchbar{background:linear-gradient(90deg,var(--mrn),var(--pink));color:#fff;border-radius:12px;padding:12px 16px;margin-bottom:16px;text-align:center;font-weight:600;font-size:.95rem;box-shadow:0 2px 14px rgba(168,46,82,.3)}
.therm.met > i{background:linear-gradient(90deg,var(--ok),#67d98a)}
.therm-nums .met-tag{font-family:'Saira Condensed',sans-serif;color:var(--ok);font-size:1.05rem}
.faq{background:var(--glass);border:1px solid var(--glass-b);border-radius:var(--r);padding:4px 20px;margin-bottom:18px}
.faq summary{cursor:pointer;padding:14px 0;font-weight:600;color:var(--txt);list-style:none}
.faq summary::-webkit-details-marker{display:none}
.faq summary::before{content:'›';display:inline-block;margin-right:10px;color:var(--pink);transition:transform .2s}
.faq[open] summary::before{transform:rotate(90deg)}
.faq ul{margin:0 0 16px 0;padding-left:20px;color:var(--txt-m);font-size:.9rem;line-height:1.7}
.faq li{margin-bottom:7px}.faq li b{color:var(--txt)}
.trust{text-align:center;font-size:.76rem;color:var(--dim);line-height:1.65;margin-top:22px;padding:16px 10px;border-top:1px solid var(--glass-b)}
.trust b{color:var(--txt-m)}.trust a{color:var(--dim);text-decoration:underline}
.trust .lock{display:block;margin-bottom:5px;color:var(--txt-m);font-weight:600}
.spinner{width:18px;height:18px;border:2.5px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;display:inline-block;animation:spin 1s linear infinite;vertical-align:-3px}
@keyframes spin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.spinner{animation:none}.therm>i{transition:none}}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--pink);outline-offset:2px}
footer{text-align:center;padding:26px 16px;font-size:.78rem;color:#9B95A0;border-top:1px solid rgba(255,255,255,.07)}
</style>
</head>

<nav class="nav">
  <a href="index.html"><div><div class="logo-main">DOWNER</div><div class="logo-sub">Basketball Academy</div></div></a>
  <a href="index.html" class="back">← Home</a>
</nav>

<div class="wrap" id="wrap">
  <div class="card closed" id="loading"><div class="kicker">🏀 Shoot-a-Thon</div><h1 style="margin-top:8px">Loading…</h1></div>
</div>

<!-- DONATE MODAL -->
<div class="modal-bg" id="modalBg">
  <div class="modal" id="modal" role="dialog" aria-modal="true"></div>
</div>

<footer>Site by <a href="https://mainline-webdesign.com/" target="_blank" rel="noopener" style="color:#9B95A0;text-decoration:underline">Main Line Web Design</a></footer>

<script>
function $(id){ return document.getElementById(id); }
function qs(k){ return new URLSearchParams(location.search).get(k); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(m){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m];}); }
function money(c){ var v=(c||0)/100; return '$'+(v%1===0?v.toLocaleString('en-US'):v.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})); }
function dollarsToCents(v){ var n=parseFloat(String(v==null?'':v).replace(/[^0-9.]/g,'')); if(!isFinite(n)||n<0) return null; return Math.round(n*100); }
var LIMITS={ minPerShot:25, minFlat:500 };
var DEMO=false, CFG=null;
var ERR_PARAMS={ notready:"That donation link isn't ready yet — we'll email it after the event.", notfound:"We couldn't find that donation. Try again below.", payfail:"Something went wrong starting your payment. Please try again.", unavailable:"Online payment isn't available right now — please try again soon.", badlink:"That link looks incomplete." };

function teamName(slug){ var t=(CFG.teams||[]).find(function(x){return x.slug===slug;}); return t?t.name:''; }
function teamBy(slug){ return (CFG.teams||[]).find(function(x){return x.slug===slug;})||null; }
function playerBy(slug){ return (CFG.players||[]).find(function(x){return x.slug===slug;})||null; }
function playersOf(teamSlug){ return (CFG.players||[]).filter(function(p){return p.team===teamSlug;}); }

function therm(raised,goal){
  var met=goal>0&&(raised||0)>=goal;
  var pct=goal>0?Math.min(100,Math.round((raised||0)/goal*100)):0;
  return '<div class="therm'+(met?' met':'')+'"><i style="width:'+pct+'%"></i></div>'+
    '<div class="therm-nums"><span><b>'+money(raised||0)+'</b> raised</span>'+(goal>0?(met?'<span class="met-tag">🎉 Goal met!</span>':'<span class="pct">'+pct+'%</span>')+'<span class="dim">of '+money(goal)+'</span>':'')+'</div>';
}

function recentFor(filter){
  // filter: null=all, {type:'team',slug} , {type:'player',slug}
  var list=(CFG.recent||[]).filter(function(r){
    if(!filter) return true;
    if(filter.type==='player') return r.target_type==='player'&&r.target_slug===filter.slug;
    if(filter.type==='team'){ if(r.target_type==='team'&&r.target_slug===filter.slug) return true; if(r.target_type==='player'){ var p=playerBy(r.target_slug); return p&&p.team===filter.slug; } return false; }
    return true;
  });
  if(!list.length) return '';
  var rows=list.slice(0,25).map(function(r){
    var who='<b>'+esc(r.name)+'</b>'+(filter?'':' <span class="dim">· '+esc(r.backs)+'</span>');
    return '<div class="s"><span class="who">'+who+'</span>'+(r.message?'<span class="msg">“'+esc(r.message)+'”</span>':'')+'</div>';
  }).join('');
  return '<div class="sec-h">Recent supporters</div><div class="card supp">'+rows+'</div>';
}

// ── Views ──────────────────────────────────────────────────────────────────
function eventCountdown(){
  if(!CFG.event_date) return '';
  var d=new Date(CFG.event_date+'T23:59:59'); if(isNaN(d)) return '';
  var dateStr=d.toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'});
  var days=Math.ceil((d-new Date())/86400000);
  var label=days>1?days+' days left':days===1?'1 day left':days===0?'Today!':'';
  return '<div style="margin:2px 0 0"><span class="chip">📅 '+esc(dateStr)+(label?' · <b>'+label+'</b>':'')+'</span></div>';
}
function leaderboard(){
  var players=(CFG.players||[]).filter(function(p){return p.raised_cents>0;}).sort(function(a,b){return b.raised_cents-a.raised_cents;}).slice(0,8);
  if(!players.length) return '';
  var rows=players.map(function(p,i){ return '<a class="lrow" href="?player='+encodeURIComponent(p.slug)+'"><span class="rank">'+(i+1)+'</span><span class="lname">'+esc(p.name)+(teamName(p.team)?'<span class="dim"> · '+esc(teamName(p.team))+'</span>':'')+'</span><span class="lamt">'+money(p.raised_cents)+'</span></a>'; }).join('');
  return '<div class="sec-h">🏆 Top fundraisers</div><div class="card lb">'+rows+'</div>';
}
function renderOrg(){
  var o=CFG.org||{};
  var teams=(CFG.teams||[]).slice().sort(function(a,b){return (b.raised_cents||0)-(a.raised_cents||0);});
  var h='';
  h+='<div class="card" style="text-align:center">'+
      '<div class="kicker">🏀 Shoot-a-Thon</div>'+
      '<h1>'+esc(CFG.title||'Shoot-a-Thon')+'</h1>'+
      '<p class="lead" style="margin:0 auto 6px">'+esc(CFG.blurb||"Sponsor an Aces player per made free throw — or make a one-time donation. Every gift counts toward their goal, their team's, and our whole program's.")+'</p>'+
      eventCountdown()+
      '<div style="max-width:480px;margin:18px auto 14px">'+therm(o.raised_cents,o.goal_cents)+'</div>'+
      '<div style="margin-top:6px"><span class="chip"><b>'+(CFG.supporter_count||0)+'</b> supporter'+((CFG.supporter_count===1)?'':'s')+'</span></div>'+
      '<div style="margin-top:16px"><button class="btn" onclick="openDonate(\'org\',\'\')">Donate to the whole program</button></div>'+
    '</div>';
  if(CFG.about){ h+='<div class="card"><div class="sec-h" style="margin:0 0 8px">About</div><div class="about" style="margin-top:0">'+esc(CFG.about)+'</div></div>'; }
  if(teams.length){
    h+='<div class="sec-h">Teams</div><div class="grid">';
    teams.forEach(function(t){
      h+='<a class="tile" href="?team='+encodeURIComponent(t.slug)+'">'+
          '<div class="tname">'+esc(t.name)+'</div>'+
          '<div class="tsub">'+playersOf(t.slug).length+' player'+(playersOf(t.slug).length===1?'':'s')+'</div>'+
          therm(t.raised_cents,t.goal_cents)+
          '<span class="go">View team →</span>'+
        '</a>';
    });
    h+='</div>';
  }
  h+=leaderboard();
  if((CFG.players||[]).length){
    h+='<div class="sec-h">Find a player</div><input class="search" id="search" placeholder="Search for a player…" autocomplete="off">'+
       '<div class="grid" id="searchResults"></div>';
  }
  h+=recentFor(null);
  h+='<details class="faq"><summary>How it works</summary><ul>'+
    '<li><b>Sponsor a player per made free throw</b> — e.g. $0.50 × 100 free throws = $50. You’re billed only <b>after</b> the event, for throws actually made.</li>'+
    '<li><b>Or donate once, now</b> — any amount, charged right away.</li>'+
    '<li>Every gift counts toward the player, their team, <b>and</b> the whole program’s goal.</li>'+
    '<li><b>Where it goes</b> — your gift supports the Aces through the organizing booster club. Payments are collected by Always Competing Sports LLC and remitted in full.</li>'+
    '</ul></details>';
  $('wrap').innerHTML=h;
  var s=$('search'); if(s){ s.addEventListener('input',runSearch); runSearch(); }
}

function runSearch(){
  var q=($('search').value||'').trim().toLowerCase();
  var list=(CFG.players||[]);
  if(q) list=list.filter(function(p){ return p.name.toLowerCase().indexOf(q)>=0 || teamName(p.team).toLowerCase().indexOf(q)>=0; });
  list=list.slice(0,12);
  $('searchResults').innerHTML=list.map(function(p){
    return '<a class="tile" href="?player='+encodeURIComponent(p.slug)+'">'+
      '<div class="tname" style="font-size:1.15rem">'+esc(p.name)+'</div>'+
      '<div class="tsub">'+esc(teamName(p.team)||'Player')+'</div>'+
      therm(p.raised_cents,p.goal_cents)+
      '<span class="go">Sponsor →</span></a>';
  }).join('') || '<p class="dim" style="padding:4px 2px">No players match.</p>';
}

function renderTeam(slug){
  var t=teamBy(slug); if(!t){ renderOrg(); return; }
  var players=playersOf(slug);
  var h='<div class="crumb"><a href="?">← All teams</a></div>';
  h+='<div class="card">'+
      '<div class="kicker">Team</div>'+
      '<h1>'+esc(t.name)+'</h1>'+
      therm(t.raised_cents,t.goal_cents)+
      '<div style="margin-top:16px"><button class="btn" onclick="openDonate(\'team\',\''+esc(t.slug)+'\')">Donate to '+esc(t.name)+'</button></div>'+
    '</div>';
  h+='<div class="sec-h">Players</div>';
  if(players.length){
    h+='<div class="grid">';
    players.forEach(function(p){
      h+='<a class="tile" href="?player='+encodeURIComponent(p.slug)+'">'+
          '<div class="tname" style="font-size:1.15rem">'+esc(p.name)+'</div>'+
          therm(p.raised_cents,p.goal_cents)+
          '<span class="go">Sponsor →</span></a>';
    });
    h+='</div>';
  } else { h+='<p class="dim">Players will appear here soon.</p>'; }
  var tlink=location.origin+location.pathname+'?team='+encodeURIComponent(slug);
  var ttext='Support the Lower Merion Aces '+t.name+' in our Shoot-a-Thon! Donate here: '+tlink;
  h+='<div class="sec-h">Share '+esc(t.name)+'</div><div class="card">'+
      '<div class="share-row"><input readonly value="'+esc(tlink)+'"><button class="btn ghost" type="button" id="tCopy">Copy link</button></div>'+
      '<div class="share-btns">'+
        '<a href="https://www.facebook.com/sharer/sharer.php?u='+encodeURIComponent(tlink)+'" target="_blank" rel="noopener">📘 Facebook</a>'+
        '<a href="https://twitter.com/intent/tweet?url='+encodeURIComponent(tlink)+'&text='+encodeURIComponent(ttext)+'" target="_blank" rel="noopener">𝕏 Post</a>'+
        '<a href="sms:?&body='+encodeURIComponent(ttext)+'">💬 Text</a>'+
      '</div></div>';
  h+=recentFor({type:'team',slug:slug});
  $('wrap').innerHTML=h;
  if($('tCopy')) $('tCopy').addEventListener('click',function(){ copyText(tlink,this); });
}

function renderPlayer(slug){
  var p=playerBy(slug); if(!p){ renderOrg(); return; }
  var tn=teamName(p.team);
  var h='<div class="crumb"><a href="?">All teams</a>'+(tn?' › <a href="?team='+encodeURIComponent(p.team)+'">'+esc(tn)+'</a>':'')+'</div>';
  h+='<div class="card">'+
      '<div class="kicker">'+(tn?esc(tn)+' · ':'')+'Shoot-a-Thon</div>'+
      '<h1>'+esc(p.name)+'</h1>'+
      therm(p.raised_cents,p.goal_cents)+
      (p.blurb?'<div class="about">'+esc(p.blurb)+'</div>':'')+
      '<div style="margin-top:18px"><button class="btn full" onclick="openDonate(\'player\',\''+esc(p.slug)+'\')">Sponsor '+esc(p.name)+' →</button></div>'+
      '<p class="dim" style="font-size:.8rem;margin-top:12px;text-align:center">Pledge per made free throw (billed after the event) or give a one-time donation now.</p>'+
    '</div>';
  // share
  var pname=p.name;
  var link=location.origin+location.pathname+'?player='+encodeURIComponent(p.slug);
  var tmpl={
    url:link,
    email:"Hi Friends and Family,\n\nI'm part of the Lower Merion Aces and I'll be shooting free throws in our team's Shoot-a-Thon! You can sponsor me per MADE free throw (anything from $0.25 to $10) or make a one-time donation.\n\nClick my link to pledge: "+link+"\n\nPlease help me reach my goal — I'll be practicing! 🏀\n\nThanks,\n"+pname,
    text:"Hi! I'm shooting in the Lower Merion Aces Shoot-a-Thon 🏀 Sponsor me per made free throw or donate here: "+link
  };
  h+='<div class="sec-h">Share '+esc(pname)+"'s page</div><div class=\"card\">"+
      '<div class="share-row"><input id="shareUrl" readonly value="'+esc(link)+'"><button class="btn ghost" type="button" data-copy="url">Copy link</button></div>'+
      '<div class="share-btns">'+
        '<a href="https://www.facebook.com/sharer/sharer.php?u='+encodeURIComponent(link)+'" target="_blank" rel="noopener">📘 Facebook</a>'+
        '<a href="https://twitter.com/intent/tweet?url='+encodeURIComponent(link)+'&text='+encodeURIComponent(tmpl.text)+'" target="_blank" rel="noopener">𝕏 Post</a>'+
        '<a href="sms:?&body='+encodeURIComponent(tmpl.text)+'">💬 Text</a>'+
        '<button type="button" id="nativeShare" style="display:none">↗ Share…</button>'+
      '</div>'+
      '<div class="share-btns"><button class="btn ghost" type="button" data-copy="email" style="flex:1">✉️ Copy email</button><button class="btn ghost" type="button" data-copy="text" style="flex:1">💬 Copy text</button></div>'+
      '<div style="text-align:center;margin-top:6px"><div id="qrbox"></div><div><button class="btn ghost" type="button" id="dlQr" style="width:auto">⬇ Download QR code</button></div></div>'+
      '<p class="dim" style="font-size:.8rem;margin-top:10px;text-align:center">Share with aunts, uncles, cousins, and friends — even out of town. Every pledge adds up!</p>'+
    '</div>';
  h+=recentFor({type:'player',slug:slug});
  $('wrap').innerHTML=h;

  if(navigator.share){ var ns=$('nativeShare'); ns.style.display=''; ns.addEventListener('click',function(){ navigator.share({title:pname+' — Aces Shoot-a-Thon',text:tmpl.text,url:link}).catch(function(){}); }); }
  // QR code (library loaded from cdnjs; degrade gracefully if blocked)

  else { $('dlQr').addEventListener('click',function(){ var cv=$('qrbox').querySelector('canvas'); var img=$('qrbox').querySelector('img'); var url=cv?cv.toDataURL('image/png'):(img?img.src:''); if(!url) return; var a=document.createElement('a'); a.href=url; a.download=pname.replace(/\s+/g,'-').toLowerCase()+'-shootathon-qr.png'; document.body.appendChild(a); a.click(); document.body.removeChild(a); }); }
}

function copyText(txt,btn){
  var done=function(){ var o=btn.textContent; btn.textContent='Copied ✓'; setTimeout(function(){btn.textContent=o;},1500); };
  if(navigator.clipboard){ navigator.clipboard.writeText(txt).then(done,function(){ fallbackCopy(txt);done(); }); }
  else { fallbackCopy(txt); done(); }
}
function fallbackCopy(txt){ var t=document.createElement('textarea'); t.value=txt; document.body.appendChild(t); t.select(); try{document.execCommand('copy');}catch(e){} document.body.removeChild(t); }

// ── Donate modal ────────────────────────────────────────────────────────
var MODAL={ type:'org', slug:'', kind:'flat', name:'' };
function openDonate(type,slug){
  MODAL.type=type; MODAL.slug=slug;
  MODAL.name = type==='player'?(playerBy(slug)||{}).name : type==='team'?teamName(slug) : 'the whole program';
  MODAL.kind = type==='player' ? 'per_shot' : 'flat';
  renderModal();
  $('modalBg').classList.add('on');
}
function closeModal(){ $('modalBg').classList.remove('on'); }
function setMKind(k){ MODAL.kind=k; renderModalFields(); }

function renderModal(){
  var isPlayer=MODAL.type==='player';
  var h='<button class="mclose" onclick="closeModal()" aria-label="Close">×</button>'+
    '<h2>Support '+esc(MODAL.name)+'</h2>'+
    '<p class="msub">'+(isPlayer?'Sponsor per made free throw, or give a one-time donation.':'Make a one-time donation. It counts toward '+esc(MODAL.name)+(MODAL.type==='team'?" and the program's":"")+' goal.')+'</p>';
  if(isPlayer){
    h+='<div class="seg" id="mSeg">'+
       '<button type="button" data-k="per_shot">Per made free throw<span class="s-sub">Billed after the event</span></button>'+
       '<button type="button" data-k="flat">One-time donation<span class="s-sub">Pay now</span></button>'+
       '</div>';
  }
  h+='<form id="dform" novalidate><div class="hp"><input type="text" name="dba_ref" tabindex="-1" autocomplete="off"></div><div id="mFields"></div>'+
     '<div class="fg"><div class="row2"><div><label>Your name</label><input class="inp" id="dname" autocomplete="name" placeholder="Your name"></div><div><label>Email</label><input class="inp" id="demail" type="email" inputmode="email" autocomplete="email" placeholder="you@email.com"></div></div></div>'+
     '<div class="fg"><label>Message <span class="dim">(optional)</span></label><input class="inp" id="dmsg" maxlength="280" placeholder="Go get ’em!"></div>'+
     '<label class="check"><input type="checkbox" id="danon"><span>Give anonymously (hide my name from the public list)</span></label>'+
     '<button class="btn full" id="dsubmit" type="submit">Continue</button>'+
     '<div class="err" id="derr"></div>'+
     '<p class="dim" style="font-size:.74rem;margin-top:12px;text-align:center">Secure checkout. Your gift supports the Aces through the organizing booster club, collected and remitted by Always Competing Sports LLC.</p>'+
     '</form>';
  $('modal').innerHTML=h;
  if(isPlayer) Array.prototype.forEach.call(document.querySelectorAll('#mSeg button'),function(b){ b.addEventListener('click',function(){ setMKind(b.getAttribute('data-k')); }); });
  $('dform').addEventListener('submit',submitDonate);
  renderModalFields();
}
function renderModalFields(){
  if(MODAL.type==='player') Array.prototype.forEach.call(document.querySelectorAll('#mSeg button'),function(b){ b.setAttribute('aria-pressed',String(b.getAttribute('data-k')===MODAL.kind)); });
  var feeLabel='<label class="check"><input type="checkbox" id="coverFee"><span>'+(MODAL.kind==='per_shot'?'Also cover the ~3% card fee so 100% reaches the Aces (added to your total after the event)':'Add the ~3% card fee so <b>100% of my gift</b> reaches the Aces')+'</span></label>';
  var h='';
  if(MODAL.kind==='per_shot'){
    h='<div class="quick" id="quick">'+[25,50,100,200].map(function(c){return '<button type="button" data-amt="'+c+'">'+money(c)+'</button>';}).join('')+'</div>'+
      '<div class="row2"><div class="fg"><label>Per made free throw</label><div class="money-in"><span class="pre">$</span><input class="inp" id="perShot" inputmode="decimal" placeholder="0.50"></div></div>'+
      '<div class="fg"><label>Cap <span class="dim">(optional)</span></label><div class="money-in"><span class="pre">$</span><input class="inp" id="cap" inputmode="decimal" placeholder="no limit"></div></div></div>'+
      '<div class="est" id="est">Enter an amount to see an estimate.</div>'+feeLabel;
  } else {
    h='<div class="quick" id="quick">'+[2500,5000,10000,25000].map(function(c){return '<button type="button" data-amt="'+c+'">'+money(c)+'</button>';}).join('')+'</div>'+
      '<div class="fg"><label>Or enter an amount</label><div class="money-in"><span class="pre">$</span><input class="inp" id="flat" inputmode="decimal" placeholder="50"></div></div>'+
      feeLabel+'<div class="est" id="charged" style="display:none"></div>';
  }
  $('mFields').innerHTML=h;
  Array.prototype.forEach.call(document.querySelectorAll('#quick button'),function(b){ b.addEventListener('click',function(){
    var c=parseInt(b.getAttribute('data-amt'),10);
    if(MODAL.kind==='per_shot'){ $('perShot').value=(c/100); mEst(); } else { $('flat').value=(c/100); mCharged(); }
    Array.prototype.forEach.call(document.querySelectorAll('#quick button'),function(x){ x.classList.toggle('on',x===b); });
  }); });
  var cf=$('coverFee'); if(cf) cf.addEventListener('change', MODAL.kind==='per_shot'?mEst:mCharged);
  var sub=$('dsubmit');
  if(MODAL.kind==='per_shot'){ sub.textContent='Pledge now'; ['perShot','cap'].forEach(function(id){ $(id).addEventListener('input',function(){ clearQuick(); mEst(); }); }); mEst(); }
  else { sub.textContent='Continue to payment →'; $('flat').addEventListener('input',function(){ clearQuick(); mCharged(); }); }
}
function clearQuick(){ Array.prototype.forEach.call(document.querySelectorAll('#quick button'),function(x){ x.classList.remove('on'); }); }
function feeCents(base){ if(!base||base<=0) return 0; var charged=Math.ceil((base+30)/(1-0.029)); return Math.max(0,charged-base); }
function mCharged(){
  var base=dollarsToCents($('flat').value), cf=$('coverFee')&&$('coverFee').checked, box=$('charged');
  if(!base){ box.style.display='none'; return; }
  var fee=cf?feeCents(base):0;
  box.style.display='block';
  box.innerHTML="You'll be charged <b>"+money(base+fee)+'</b>'+(fee>0?' ('+money(base)+' gift + '+money(fee)+' fee)':'')+'.';
}
function mEst(){
  var per=dollarsToCents($('perShot').value), cap=dollarsToCents($('cap').value);
  if(!per){ $('est').innerHTML='Enter an amount to see an estimate.'; return; }
  var ex=100, raw=per*ex, capped=(cap&&cap>0)?Math.min(raw,cap):raw;
  var cf=$('coverFee')&&$('coverFee').checked;
  $('est').innerHTML='If '+esc(MODAL.name)+' makes <b>'+ex+'</b> free throws, that’s <b>'+money(capped)+'</b>'+((cap&&cap>0)?' (capped at '+money(cap)+')':'')+'. You only pay for throws made.'+(cf?' Plus ~3% to cover the card fee.':'');
}
function mErr(m){ $('derr').textContent=m||''; }

function submitDonate(e){
  e.preventDefault(); mErr('');
  var name=$('dname').value.trim(), email=$('demail').value.trim();
  if(!name) return mErr('Please enter your name.');
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return mErr('Please enter a valid email.');
  var payload={ dba_ref:(document.querySelector('[name=dba_ref]').value||'').trim(), kind:MODAL.kind, target_type:MODAL.type, target_slug:MODAL.slug, donor_name:name, donor_email:email, message:$('dmsg').value.trim(), anonymous:$('danon').checked, cover_fee:($('coverFee')&&$('coverFee').checked)?true:false };
  if(MODAL.kind==='per_shot'){
    var per=dollarsToCents($('perShot').value);
    if(!per||per<LIMITS.minPerShot) return mErr('Enter at least $0.25 per made free throw.');
    var cap=dollarsToCents($('cap').value);
    payload.per_shot_cents=per;
    if(cap&&cap>0){ if(cap<per) return mErr('Your cap should be at least '+money(per)+'.'); payload.cap_cents=cap; }
  } else {
    var flat=dollarsToCents($('flat').value);
    if(!flat||flat<LIMITS.minFlat) return mErr('Enter at least $5.');
    payload.flat_cents=flat;
  }
  var btn=$('dsubmit'), old=btn.innerHTML; btn.disabled=true; btn.innerHTML='<span class="spinner"></span> Working…';
  if(DEMO){ setTimeout(function(){ btn.disabled=false; btn.innerHTML=old; demoDone(payload); },500); return; }
  fetch('/api/pledge',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)})
    .then(function(r){ return r.json().then(function(d){ return {status:r.status,d:d}; }); })
    .then(function(res){
      var d=res.d||{};
      if(res.status===200 && d.pay && d.url){ window.location.href=d.url; return; }       // pay now
      if(res.status===200 && d.pledged){ btn.disabled=false; btn.innerHTML=old; pledgedDone(payload); return; }
      btn.disabled=false; btn.innerHTML=old;
      var map={ closed:'Donations are closed right now.', unknown_player:'That player isn\'t in this event.', unknown_team:'That team isn\'t in this event.', bad_amount:'Please enter a valid amount.', bad_per_shot:'Enter at least $0.25 per made free throw.', not_configured:'Payments aren\'t available right now — please try again soon.', checkout_failed:'Couldn\'t start payment. Please try again.' };
      mErr(map[d.error]||'Sorry, something went wrong. Please try again.');
    })
    .catch(function(){ btn.disabled=false; btn.innerHTML=old; mErr('Network error — please try again.'); });
}
function pledgedDone(payload){
  try{ if(window.gtag) gtag('event','pledge',{method:'per_shot'}); }catch(e){}
  $('modal').innerHTML='<button class="mclose" onclick="closeModal()">×</button>'+
    '<div style="text-align:center;padding:12px 0"><div style="font-size:2.4rem">🙌</div>'+
    '<h2>Pledge received — thank you!</h2>'+
    '<p class="msub" style="margin-top:6px">Thanks for sponsoring <b>'+esc(MODAL.name)+'</b>! We’ll count every made free throw, then email <b>'+esc(payload.donor_email)+'</b> a secure link for your exact total. Nothing has been charged yet.</p>'+
    '<button class="btn" onclick="closeModal()">Done</button></div>';
}
function demoDone(payload){
  if(payload.kind==='flat'){ $('modal').innerHTML='<button class="mclose" onclick="closeModal()">×</button><div style="text-align:center;padding:12px 0"><div style="font-size:2.4rem">💳</div><h2>Demo</h2><p class="msub">In the real version this takes you to secure Stripe checkout to pay '+money(payload.flat_cents)+' now.</p><button class="btn" onclick="closeModal()">Close</button></div>'; }
  else pledgedDone(payload);
}

// ── Boot / router ─────────────────────────────────────────────────────────
function route(){
  if(!CFG||!CFG.open){ $('wrap').innerHTML='<div class="card closed"><div class="kicker">🏀 Shoot-a-Thon</div><h1 style="margin-top:8px">Coming soon</h1><p class="lead" style="margin:0 auto">Our Shoot-a-Thon isn’t open just yet — check back shortly. Questions? <a href="mailto:aceshoops@gmail.com" style="color:var(--txt-m);text-decoration:underline">aceshoops@gmail.com</a></p></div>'; return; }
  var player=qs('player'), team=qs('team');
  if(player) renderPlayer(player);
  else if(team) renderTeam(team);
  else renderOrg();
  var e=qs('e'); if(e&&ERR_PARAMS[e]){ var b=document.createElement('div'); b.className='banner'; b.textContent=ERR_PARAMS[e]; $('wrap').insertBefore(b,$('wrap').firstChild); }
  if(CFG.match_text){ var mb=document.createElement('div'); mb.className='matchbar'; mb.innerHTML='🔥 '+esc(CFG.match_text); $('wrap').insertBefore(mb,$('wrap').firstChild); }
  var ts=document.createElement('div'); ts.className='trust';
  ts.innerHTML='<div class="lock">🔒 Secure checkout by Stripe</div>Your gift supports <b>'+esc(CFG.booster_name||'the organizing booster club')+'</b> through the Aces Shoot-a-Thon. Payments are collected by Always Competing Sports LLC on their behalf and remitted in full. Questions? <a href="mailto:aceshoops@gmail.com">aceshoops@gmail.com</a>';
  $('wrap').appendChild(ts);
}

document.addEventListener('DOMContentLoaded',function(){
  $('modalBg').addEventListener('click',function(e){ if(e.target===$('modalBg')) closeModal(); });
  document.addEventListener('keydown',function(e){ if(e.key==='Escape') closeModal(); });
  if(qs('demo')==='1'){ DEMO=true; CFG=DEMO_CFG; route(); return; }
