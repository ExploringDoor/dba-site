<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--mrn:#8B1A2B;--mrn-h:#A82E42;--pink:#D4506A;--bg:#0A0A0C;--txt:#F0ECE8;--dim:#9B95A0}
body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
.mark{font-family:'Saira Condensed',sans-serif;font-weight:800;letter-spacing:5px;font-size:22px;text-transform:uppercase;color:#fff;margin-bottom:28px}
.mark .line{width:120px;height:2px;background:linear-gradient(90deg,transparent,#c8102e,transparent);margin:5px auto}
.mark .sub{font-size:11px;letter-spacing:9px;color:#888}
h1{font-family:'DM Serif Display',serif;font-weight:400;font-size:clamp(3rem,10vw,5rem);color:var(--pink);line-height:1}
p{color:var(--dim);margin:12px 0 28px;font-size:1.05rem}
.btns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
a.btn{display:inline-flex;align-items:center;gap:8px;padding:13px 26px;border-radius:12px;font-weight:600;font-size:.9rem;text-decoration:none;transition:all .3s}
.btn-m{background:var(--mrn);color:#fff}.btn-m:hover{background:var(--mrn-h)}
.btn-ghost{background:rgba(255,255,255,.04);color:var(--txt);border:1px solid rgba(255,255,255,.1)}
</style>
</head>

</div>
</body>
